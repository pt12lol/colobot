<!DOCTYPE html>
<html lang="pl" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Colobot (fork) - features</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --brand:#ffb300; }
    body {
      background:
        radial-gradient(1200px 600px at 80% -10%, rgba(255,179,0,.12), transparent 60%),
        radial-gradient(900px 500px at -10% 20%, rgba(13,110,253,.12), transparent 55%),
        #0d1117;
      min-height:100vh;
    }
    .text-brand { color: var(--brand) !important; }
    .card { background: rgba(22,27,34,.7); border:1px solid #30363d; backdrop-filter: blur(6px); }
    .feat-ico { font-size:2rem; }
    a { text-decoration:none; }
    kbd { background:#30363d; color:#e6edf3; border:1px solid #565e68; box-shadow:0 1px 0 #1c2128; }
    .nav-pills .nav-link { color:#e6edf3; }
    .nav-pills .nav-link.active { background-color: var(--brand); color:#1a1a1a; }
  </style>
</head>
<body>
<div class="container py-4" style="max-width: 820px;">

  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <ul class="nav nav-pills">
      <li class="nav-item"><a class="nav-link" href="index.html" data-i18n="tab_install"></a></li>
      <li class="nav-item"><a class="nav-link active" href="features.html" data-i18n="tab_features"></a></li>
    </ul>
    <div class="btn-group btn-group-sm" role="group" aria-label="Language">
      <input type="radio" class="btn-check" name="lang" id="langPl" value="pl">
      <label class="btn btn-outline-warning" for="langPl">&#127477;&#127473; PL</label>
      <input type="radio" class="btn-check" name="lang" id="langEn" value="en">
      <label class="btn btn-outline-warning" for="langEn">&#127468;&#127463; EN</label>
    </div>
  </div>

  <header class="text-center mb-5">
    <h1 class="fw-bold" data-i18n="h1"></h1>
    <p class="lead text-secondary" data-i18n="sub"></p>
  </header>

  <div class="card p-4 mb-3">
    <div class="d-flex align-items-center gap-3 mb-2">
      <span class="feat-ico text-brand">&#9998;</span>
      <h4 class="mb-0" data-i18n="f1_h"></h4>
    </div>
    <p class="mb-2" data-i18n="f1_p"></p>
    <ul class="text-secondary mb-0">
      <li data-i18n="f1_a"></li>
      <li data-i18n="f1_b"></li>
      <li data-i18n="f1_c"></li>
      <li data-i18n="f1_d"></li>
    </ul>
  </div>

  <div class="card p-4 mb-3">
    <div class="d-flex align-items-center gap-3 mb-2">
      <span class="feat-ico text-brand">&#128218;</span>
      <h4 class="mb-0" data-i18n="f2_h"></h4>
    </div>
    <p class="mb-0" data-i18n="f2_p"></p>
  </div>

  <div class="card p-4 mb-4">
    <div class="d-flex align-items-center gap-3 mb-2">
      <span class="feat-ico text-brand">&#128190;</span>
      <h4 class="mb-0" data-i18n="f3_h"></h4>
    </div>
    <p class="mb-0" data-i18n="f3_p"></p>
  </div>

  <div class="text-center">
    <a href="index.html" class="btn btn-warning btn-lg fw-semibold px-5 py-3" style="box-shadow:0 0 36px rgba(255,179,0,.45);" data-i18n="cta"></a>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const I18N = {
    pl: {
      back: "&#8592; Instalacja",
      tab_install: "Instalacja",
      tab_features: "O tym forku",
      h1: "Co wyróżnia tego forka?",
      sub: "Klasyczny Colobot, ale edytor kodu robotów podciągnięty do XXI wieku.",
      f1_h: "Autouzupełnianie kodu (IntelliSense)",
      f1_p: "Podpowiedzi wprost w edytorze robota - <kbd>Ctrl</kbd>+<kbd>Space</kbd>, a po kropce automatycznie.",
      f1_a: "Słowa kluczowe, funkcje wbudowane, typy, stałe gry (np. <code>TitaniumOre</code>).",
      f1_b: "Funkcje i zmienne zadeklarowane w Twoim skrypcie.",
      f1_c: "Po kropce (<code>obj.</code>) pola obiektu dobrane wg typu zmiennej.",
      f1_d: "Lista przewijalna, kolorowe znaczniki jak w kolorowaniu składni; strzałki/Enter/Tab wybierają, Esc zamyka.",
      f2_h: "Skok do dokumentacji (F12)",
      f2_p: "Ustaw kursor na dowolnym elemencie - funkcji (<code>radar</code>, <code>goto</code>), typie lub obiekcie (<code>TitaniumOre</code>) - i wciśnij <kbd>F12</kbd>. Otworzy się strona pomocy dokładnie tego elementu.",
      f3_h: "Synchronizacja z zewnętrznym edytorem",
      f3_p: "Programy robotów lądują jako pliki na dysku, więc możesz je pisać w VS Code czy innym edytorze. Powrót do okna gry przeładowuje zmiany, a <kbd>Shift</kbd>+<kbd>F5</kbd> od razu uruchamia program.",
      cta: "Zainstaluj i sprawdź"
    },
    en: {
      back: "&#8592; Install",
      tab_install: "Install",
      tab_features: "About this fork",
      h1: "What makes this fork different?",
      sub: "Classic Colobot, but the robot code editor dragged into the 21st century.",
      f1_h: "Code autocomplete (IntelliSense)",
      f1_p: "Suggestions right in the robot editor - <kbd>Ctrl</kbd>+<kbd>Space</kbd>, and automatically after a dot.",
      f1_a: "Keywords, built-in functions, types, game constants (e.g. <code>TitaniumOre</code>).",
      f1_b: "Functions and variables declared in your own script.",
      f1_c: "After a dot (<code>obj.</code>): object fields matched to the variable's type.",
      f1_d: "Scrollable list, colored markers matching the syntax highlighter; arrows/Enter/Tab pick, Esc closes.",
      f2_h: "Jump to docs (F12)",
      f2_p: "Put the caret on any element - a function (<code>radar</code>, <code>goto</code>), a type, or an object (<code>TitaniumOre</code>) - and hit <kbd>F12</kbd>. The help page for exactly that element opens.",
      f3_h: "External editor sync",
      f3_p: "Robot programs live as files on disk, so you can write them in VS Code or any editor. Switching back to the game window reloads the changes, and <kbd>Shift</kbd>+<kbd>F5</kbd> runs the program right away.",
      cta: "Install and try it"
    }
  };

  function setLang(l) {
    const lang = (l === "pl") ? "pl" : "en";
    document.documentElement.lang = lang;
    const t = I18N[lang];
    document.querySelectorAll("[data-i18n]").forEach(el => {
      const k = el.getAttribute("data-i18n");
      if (t[k] !== undefined) el.innerHTML = t[k];
    });
    document.getElementById(lang === "pl" ? "langPl" : "langEn").checked = true;
    try { localStorage.setItem("colobot-fork-lang", lang); } catch (e) {}
  }
  document.querySelectorAll('input[name="lang"]')
    .forEach(el => el.addEventListener("change", () => setLang(el.value)));

  let saved = null;
  try { saved = localStorage.getItem("colobot-fork-lang"); } catch (e) {}
  const sys = (navigator.language || "en").toLowerCase().startsWith("pl") ? "pl" : "en";
  setLang(saved || sys);
</script>
</body>
</html>
